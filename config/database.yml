default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: family_app_development

test:
  <<: *default
  database: family_app_test
  username: postgres
  password: password
  host: localhost
  
production:
  primary:
    <<: *default
    database: family_app_production